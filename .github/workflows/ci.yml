name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: npm run typecheck -w worker

      - name: Lint web
        run: npm run lint -w web

      # tsc -b plus vite build: catches type errors the worker check cannot see.
      - name: Build web
        run: npm run build -w web

      - name: Test worker
        run: npm test -w worker
